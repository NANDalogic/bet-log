# Hourly outage check for the Supabase database behind bets.nandalogic.com.
# Calls the public `health` Edge Function (Supabase/functions/health), which reads one bets row server-side and answers {"ok":true}.
# Since 10/23/2026 the data itself needs a sign-in, so this no longer reads public.bets with the public key.
# A timeout or non-2xx response fails the run, and GitHub emails the repo owner about failed scheduled runs.
name: db-health

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the health function
        env:
          URL: https://pqkteawpnislalfxxtvc.supabase.co/functions/v1/health
        run: |
          curl -fsS -m 30 --retry 2 --retry-delay 20 --retry-all-errors "$URL" -o body.json
          echo "Response: $(cat body.json)"
          grep -q '"ok":true' body.json || { echo "Health check did not say ok"; exit 1; }
